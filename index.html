<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KazuistiCard — mladí lekári</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; overflow-x: hidden; }

    /* ── Brand tokens (fixed Mladí Lekári pink/mint — never overridden by the specialty theme) ── */
    :root {
      --accent:       #e91680;
      --accent2:      #f472b6;
      --accent-strong:#c91270;
      --accent-soft:  rgba(233,22,128,0.09);
      --accent-glow:  rgba(233,22,128,0.30);
      --mint:  #3ecfb2;
      --mint2: #27b99d;
      /* specialty-theme tokens — consumed ONLY by .day-label, set live by applyTheme() */
      --theme-color:  #e91680;
      --theme-strong: #c91270;
      --theme-soft:   rgba(233,22,128,0.09);
      --theme-glow:   rgba(233,22,128,0.30);
    }
    /* smooth morph when the theme changes between cases */
    .day-label { transition: background 0.55s ease, border-color 0.55s ease, color 0.55s ease, box-shadow 0.55s ease; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #fff;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      transition: background-color 1.4s ease;
    }
    body.bg-good { background: #f0fdf8; }
    body.bg-bad  { background: #fdf2f8; }
    ::placeholder { color: #c0cad6; }

    /* ── Animations ── */
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes gradePop { 0%{transform:scale(0.3) rotate(-10deg);opacity:0;} 65%{transform:scale(1.1) rotate(2deg);} 100%{transform:scale(1) rotate(0);opacity:1;} }
    @keyframes clueReveal { from { opacity:0; transform:translateY(-8px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes shake    { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

    @keyframes morphPink {
      0%,100% { border-radius: 62% 38% 46% 54% / 60% 44% 56% 40%; }
      20%     { border-radius: 45% 55% 54% 46% / 38% 64% 36% 62%; }
      40%     { border-radius: 38% 62% 38% 62% / 54% 46% 54% 46%; }
      60%     { border-radius: 56% 44% 60% 40% / 48% 52% 48% 52%; }
      80%     { border-radius: 48% 52% 44% 56% / 62% 38% 62% 38%; }
    }
    @keyframes morphMint {
      0%,100% { border-radius: 40% 60% 55% 45% / 48% 56% 44% 52%; }
      25%     { border-radius: 58% 42% 40% 60% / 62% 38% 58% 42%; }
      50%     { border-radius: 46% 54% 62% 38% / 40% 60% 40% 60%; }
      75%     { border-radius: 60% 40% 48% 52% / 52% 48% 64% 36%; }
    }
    @keyframes ringPulse {
      0%,100% { opacity: 0.12; transform: scale(1); }
      50%     { opacity: 0.22; transform: scale(1.03); }
    }

    /* ── Background blobs ── */
    #blob-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .blob { position: absolute; will-change: transform; transition: transform 0.1s linear; }
    /* Soft glows tucked into the four corners — never over the reading column */
    #blob-pink {
      width: 440px; height: 440px;
      background: radial-gradient(circle at 40% 40%, #f472b6, #e91680 60%, rgba(233,22,128,0));
      top: -240px; left: -240px; opacity: 0.3;
      animation: morphPink 10s ease-in-out infinite; filter: blur(45px);
    }
    #blob-mint {
      width: 440px; height: 440px;
      background: radial-gradient(circle at 60% 55%, #7ff5e2, #3ecfb2 55%, rgba(62,207,178,0));
      top: -230px; right: -240px; opacity: 0.3;
      animation: morphMint 12s ease-in-out infinite; filter: blur(45px);
    }
    #blob-pink2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(233,22,128,0.45), rgba(233,22,128,0));
      bottom: -220px; left: -200px; opacity: 0.28; filter: blur(50px);
      animation: morphMint 14s ease-in-out infinite reverse;
    }
    #blob-mint2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(62,207,178,0.4), rgba(62,207,178,0));
      bottom: -200px; right: -190px; opacity: 0.28; filter: blur(50px);
      animation: morphPink 11s ease-in-out infinite 2s;
    }

    .ring-svg { position: absolute; pointer-events: none; }
    #rings-left  { left: -200px; top: 38%; transform: translateY(-50%); animation: ringPulse 6s ease-in-out infinite; }
    #rings-right { right: -200px; top: 62%; transform: translateY(-50%); animation: ringPulse 6s ease-in-out infinite 3s; }

    /* ── Main content ── */
    #main-wrap { position: relative; z-index: 1; min-height: 100vh; padding: 40px 20px 120px; }

    /* ── Cards (glassmorphism) ── */
    .card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.8);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }

    /* ── Clue cards ── */
    .clue {
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(226,232,240,0.9);
      border-left: 4px solid var(--accent);
      border-radius: 16px;
      padding: 16px 22px;
      font-size: 14.5px; line-height: 1.6; color: #1e293b;
      box-shadow: 0 4px 20px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.7);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: flex; gap: 13px; align-items: flex-start;
      animation: clueReveal 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .clue-num {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg,var(--accent),var(--accent-strong));
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #fff; margin-top: 1px;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .clue.locked {
      background: rgba(226,232,240,0.55); border-color: transparent; border-left-color: #cbd5e1;
      box-shadow: none; color: #94a3b8; min-height: 56px; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; backdrop-filter: blur(4px);
    }
    .clue.locked .clue-num { background: #cbd5e1; box-shadow: none; }
    .clue-text { flex:1; min-width:0; }

    /* ── Image clue (radiology / ECG / derm) ── */
    .clue-img { margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid rgba(226,232,240,0.9); background:#0b1220; }
    .clue-img.failed { display:none; }                       /* broken image → case still fully playable */
    .clue-img img { display:block; width:100%; max-height:320px; object-fit:contain; background:#0b1220; cursor:zoom-in; }
    .clue-img figcaption { padding:8px 12px; font-size:11.5px; color:#94a3b8; line-height:1.5; background:rgba(248,250,252,0.95); display:flex; flex-direction:column; gap:2px; }
    .clue-img .ci-cap { font-weight:600; color:#475569; }
    .clue-img .ci-credit a { color:#0d9488; text-decoration:none; }
    .clue-img .ci-credit a:hover { text-decoration:underline; }

    /* ── Video clue (embedded clip, e.g. clinical sign) ── */
    .clue-video { margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid rgba(226,232,240,0.9); background:#0b1220; }
    .clue-video .cv-frame { position:relative; width:100%; padding-top:56.25%; background:#0b1220; }
    .clue-video .cv-frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    /* neutral facade: hides the platform's own title/thumbnail until the user opts in to play */
    .clue-video .cv-facade { position:absolute; inset:0; width:100%; height:100%; border:0; background:linear-gradient(135deg,#111827,#1f2937); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; cursor:pointer; color:#e2e8f0; }
    .clue-video .cv-facade .cv-play { width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; transition:transform 0.2s ease, background 0.2s ease; }
    .clue-video .cv-facade:hover .cv-play { transform:scale(1.08); background:rgba(255,255,255,0.22); }
    .clue-video .cv-facade .cv-play svg { width:22px; height:22px; fill:#fff; margin-left:3px; }
    .clue-video .cv-facade span { font-size:13px; font-weight:600; color:rgba(226,232,240,0.85); }
    .clue-video figcaption { padding:8px 12px; font-size:11.5px; color:#94a3b8; line-height:1.5; background:rgba(248,250,252,0.95); }
    .clue-video figcaption a { color:#0d9488; text-decoration:none; }
    .clue-video figcaption a:hover { text-decoration:underline; }

    /* ── Lightbox ── */
    #lightbox { position:fixed; inset:0; z-index:600; display:none; align-items:center; justify-content:center; background:rgba(2,6,23,0.92); padding:24px; }
    #lightbox.open { display:flex; }
    #lightbox img { max-width:96vw; max-height:86vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.55); }
    #lightbox .lb-cap { position:absolute; bottom:18px; left:0; right:0; text-align:center; color:#cbd5e1; font-size:12.5px; padding:0 24px; line-height:1.5; }
    #lightbox .lb-cap a { color:#5eead4; }
    #lightbox .lb-close { position:absolute; top:16px; right:20px; width:42px; height:42px; border:none; border-radius:50%; background:rgba(255,255,255,0.14); color:#fff; font-size:24px; cursor:pointer; line-height:1; }
    #lightbox .lb-close:hover { background:rgba(255,255,255,0.24); }

    /* ── Inputs ── */
    .field {
      width: 100%;
      background: rgba(248,250,252,0.9);
      border: 1.5px solid #e2e8f0; border-radius: 14px;
      padding: 14px 16px; font-size: 15px; color: #0f172a; outline: none;
      font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      caret-color: var(--accent);
    }
    .field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); background: #fff; }
    .field:disabled { background: rgba(241,245,249,0.7); color: #94a3b8; cursor: not-allowed; }

    .sublabel { font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8; margin-bottom:12px; }
    .spinner { display:inline-block;width:17px;height:17px;border:2.5px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0; }

    /* ── Autocomplete ── */
    .ac-wrap { flex: 1; position: relative; }
    .dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: rgba(255,255,255,0.98); border: 1px solid #e2e8f0; border-radius: 14px;
      max-height: 250px; overflow-y: auto; z-index: 120;
      box-shadow: 0 12px 36px rgba(15,23,42,0.16); display: none;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .dropdown.open { display: block; }
    .dd-item { padding: 11px 16px; font-size: 14px; color: #334155; cursor: pointer; border-bottom: 1px solid #f1f5f9; transition: background 0.1s, color 0.1s; }
    .dd-item:last-child { border-bottom: none; }
    .dd-item:hover, .dd-item.active { background: rgba(62,207,178,0.12); color: #0d9488; font-weight: 600; }
    .dd-item .match { color: var(--accent); font-weight: 700; }
    .dd-item .dd-alias-tag { color:#94a3b8; font-weight:500; font-size:12px; margin-left:6px; }
    .dd-empty { padding: 13px 16px; font-size: 14px; color: #94a3b8; font-style: italic; }
    .dd-group-header { padding: 10px 16px; font-size: 13px; font-weight: 700; color: #64748b; cursor: pointer;
      background: rgba(148,163,184,0.08); border-bottom: 1px solid #f1f5f9; display:flex; align-items:center; justify-content:space-between; user-select:none; }
    .dd-group-header:hover { background: rgba(62,207,178,0.10); color:#0d9488; }
    .dd-group-header .chev { font-size:11px; transition: transform 0.15s ease; }
    .dd-group-header.expanded .chev { transform: rotate(90deg); }
    .dd-group-sub { padding: 7px 16px 4px; font-size: 11.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; background: rgba(148,163,184,0.05); }

    .btn-primary {
      flex-shrink: 0; border: none; border-radius: 14px; padding: 14px 26px;
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
      background: linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow: 0 6px 20px var(--accent-glow); transition: transform 0.12s, filter 0.15s, background 0.55s ease, box-shadow 0.55s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { background: #e2e8f0; color: #94a3b8; box-shadow: none; cursor: not-allowed; }

    /* ── Banner ── */
    .banner {
      border-radius: 14px; padding: 14px 20px; text-align: center;
      font-size: 16px; font-weight: 700; margin-bottom: 16px;
      display: none; align-items: center; justify-content: center; gap: 8px;
      backdrop-filter: blur(8px);
    }
    .banner.show { display: flex; animation: gradePop 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
    .banner.incorrect { background: rgba(254,226,226,0.85); color: #b91c1c; border: 1.5px solid #fca5a5; }
    .banner.close     { background: rgba(255,237,213,0.9);  color: #c2410c; border: 1.5px solid #fdba74; }
    .banner.correct   { background: rgba(220,252,231,0.85); color: #15803d; border: 1.5px solid #86efac; }
    .banner.failed    { background: rgba(254,243,199,0.85); color: #92400e; border: 1.5px solid #fcd34d; }

    /* ── Wrong-guess chips ── */
    .ghist { margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .gchip { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 13.5px; color: #94a3b8; font-weight: 500; }
    .gchip .x { flex-shrink:0; width:18px; height:18px; border-radius:50%; background:linear-gradient(135deg,#fb7185,#e11d48); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
    .gchip.close .x { background:linear-gradient(135deg,#fdba74,#f97316); }
    .gchip.close { color:#c2410c; }

    /* ── Grade / explanation ── */
    .grade-card { border-radius:24px;padding:30px 26px 26px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.14); }
    .grade-card::after { content:'';position:absolute;top:-40%;left:-20%;width:140%;height:140%;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,0.18),transparent 55%);pointer-events:none; }
    .grade-emoji  { font-size:46px;display:block;margin-bottom:4px;animation:gradePop 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
    .grade-label  { font-size:23px;font-weight:800;color:#fff;margin-top:6px;letter-spacing:-0.01em; }
    .grade-sub    { font-size:14px;color:rgba(255,255,255,0.78);margin-top:4px; }
    .answer-pill  { display:inline-block;margin-top:14px;background:rgba(255,255,255,0.22);border:1.5px solid rgba(255,255,255,0.4);border-radius:999px;padding:8px 22px;font-size:18px;font-weight:800;color:#fff;letter-spacing:0.01em; }

    .exp-head { font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#0d9488;margin-bottom:8px; }
    .exp-body { font-size:14px;line-height:1.75;color:#334155; }

    /* ── AMBOSS promo (brand teal sampled directly from the AMBOSS logo asset) ── */
    :root { --ab-900:#043e40; --ab-700:#0a6e71; --ab-600:#0c8a8f; --ab-500:#009ba4; --ab-300:#7fe3dd; }
    .amboss-promo {
      position:relative; overflow:hidden; border-radius:26px; margin-top:16px;
      padding:30px 26px 28px;
      background:linear-gradient(160deg,var(--ab-900) 0%,var(--ab-700) 45%,var(--ab-500) 100%);
      box-shadow:0 22px 50px rgba(4,62,64,0.32);
    }
    .amboss-promo::before, .amboss-promo::after {
      content:''; position:absolute; border-radius:50%; pointer-events:none; filter:blur(38px);
    }
    .amboss-promo::before { width:260px; height:260px; background:rgba(127,227,221,0.35); top:-110px; right:-90px; animation:ambossGlow 7s ease-in-out infinite; }
    .amboss-promo::after  { width:220px; height:220px; background:rgba(255,255,255,0.10); bottom:-100px; left:-80px; animation:ambossGlow 8s ease-in-out infinite 1.5s; }
    @keyframes ambossGlow { 0%,100%{ transform:scale(1); opacity:0.8; } 50%{ transform:scale(1.15); opacity:1; } }

    .amboss-promo-inner { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .amboss-mark { margin-bottom:22px; }
    .amboss-mark img { height:98px; width:auto; display:block; filter:brightness(0) invert(1); }

    .amboss-headline { font-size:23px; font-weight:800; line-height:1.28; color:#fff; letter-spacing:-0.01em; margin-bottom:11px; max-width:420px; }
    .amboss-headline em { font-style:normal; color:var(--ab-300); }
    .amboss-quote { font-size:13.5px; line-height:1.65; color:rgba(255,255,255,0.74); font-style:italic; margin-bottom:24px; max-width:380px; }

    .amboss-cta {
      position:relative; overflow:hidden; isolation:isolate;
      display:inline-flex; align-items:center; gap:9px; text-decoration:none;
      background:#fff; color:var(--ab-700); font-weight:800; font-size:14.5px;
      padding:13px 22px; border-radius:15px;
      box-shadow:0 12px 28px rgba(0,0,0,0.24); transition:transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s ease;
    }
    .amboss-cta span { position:relative; z-index:1; }
    .amboss-cta .arrow { position:relative; z-index:1; transition:transform 0.22s ease; }
    .amboss-cta:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 18px 36px rgba(0,0,0,0.3); }
    .amboss-cta:hover .arrow { transform:translateX(4px); }
    .amboss-cta:active { transform:translateY(-1px) scale(0.98); }
    .amboss-cta::after {
      content:''; position:absolute; z-index:0; top:0; left:-60%; width:45%; height:100%;
      background:linear-gradient(115deg, transparent, rgba(10,110,113,0.14), transparent);
      transform:skewX(-18deg); animation:ambossShimmer 3.4s ease-in-out infinite;
    }
    @keyframes ambossShimmer { 0%,15%{ left:-60%; } 65%,100%{ left:130%; } }

    /* decorative MacBook mockup (stylized homage, not a literal screenshot) — closed until scrolled into view, then opens */
    .amboss-mac-wrap { margin-top:32px; perspective:1600px; }
    .amboss-mac { position:relative; width:300px; }
    .amboss-mac-lid {
      position:relative; width:100%; aspect-ratio:16/10.4; background:#0b1113; border-radius:10px 10px 3px 3px;
      padding:8px 8px 0; transform-origin:bottom center; transform:rotateX(-96deg); transition:transform 1.1s cubic-bezier(.22,1,.36,1);
      box-shadow:0 25px 55px rgba(0,0,0,0.4);
    }
    .amboss-mac.open .amboss-mac-lid { transform:rotateX(-6deg); }
    .amboss-mac-cam { position:absolute; top:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:#1a2224; }
    .amboss-screen { width:100%; height:100%; background:#eef7f6; border-radius:5px; overflow:hidden; }
    .amboss-screen-head { background:linear-gradient(135deg,var(--ab-700),var(--ab-500)); padding:10px 14px; display:flex; align-items:center; gap:12px; }
    .amboss-screen-head img { height:26px; width:auto; display:block; filter:brightness(0) invert(1); opacity:0.95; flex-shrink:0; }
    .amboss-search { flex:1; background:#fff; border-radius:8px; padding:6px 11px; display:flex; align-items:center; gap:7px; }
    .amboss-search svg { width:12px; height:12px; stroke:#94a3b8; flex-shrink:0; }
    .amboss-search span { font-size:10px; color:#94a3b8; font-weight:600; }
    .amboss-screen-body { padding:10px 14px 12px; display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .amboss-row { background:#fff; border-radius:8px; padding:7px 8px; display:flex; align-items:center; gap:7px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
    .amboss-row .dot { width:13px; height:13px; border-radius:4px; background:linear-gradient(135deg,var(--ab-500),var(--ab-700)); flex-shrink:0; }
    .amboss-row .lines { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
    .amboss-row .line { height:4px; border-radius:2px; background:#dde9e8; }
    .amboss-row .line.short { width:52%; }
    .amboss-row.highlight-row { background:linear-gradient(135deg,var(--ab-500),var(--ab-700)); grid-column:1 / -1; }
    .amboss-row .real-label { font-size:9.5px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .amboss-mac-base {
      width:112%; margin-left:-6%; height:12px; background:linear-gradient(180deg,#1c2426,#0b1113);
      border-radius:0 0 10px 10px; position:relative;
      box-shadow:0 10px 18px rgba(0,0,0,0.35);
    }
    .amboss-mac-base::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:16%; height:5px; background:#050707; border-radius:0 0 6px 6px; }

    /* stat tiles below the hero card — 2x2 grid + a full-width highlight banner, generous spacing */
    .amboss-stats { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px; }
    .amboss-stat {
      background:rgba(0,155,164,0.06); border:1.5px solid rgba(0,155,164,0.18);
      border-radius:19px; padding:20px 18px; opacity:0; animation:ambossPop 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
      transition:transform 0.18s ease, box-shadow 0.18s ease;
    }
    .amboss-stat:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,155,164,0.16); }
    .amboss-stat svg { width:22px; height:22px; stroke:var(--ab-500); margin-bottom:10px; }
    .amboss-stat b { display:block; font-size:26px; font-weight:800; color:var(--ab-700); letter-spacing:-0.01em; }
    .amboss-stat p { font-size:12.5px; line-height:1.5; color:#475569; margin-top:5px; font-weight:600; }
    .amboss-stat.highlight {
      grid-column:1 / -1; background:linear-gradient(135deg,var(--ab-700),var(--ab-500)); border-color:transparent;
      display:flex; align-items:center; gap:14px; text-align:left;
    }
    .amboss-stat.highlight svg { margin-bottom:0; stroke:#fff; flex-shrink:0; }
    .amboss-stat.highlight b { font-size:16px; }
    .amboss-stat.highlight b, .amboss-stat.highlight p { color:#fff; }
    .amboss-stat.highlight p { margin-top:2px; }
    @keyframes ambossPop { from{ opacity:0; transform:translateY(10px) scale(0.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
    @media (max-width:480px){ .amboss-stats{ grid-template-columns:1fr; } .amboss-stat.highlight{ grid-column:1; } }

    .share-btn {
      display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:11px 22px;
      background:linear-gradient(135deg,#3ecfb2,#27b99d);color:#fff;border:none;border-radius:13px;
      font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(62,207,178,0.3);transition:filter 0.15s;
    }
    .share-btn:hover { filter:brightness(1.05); }

    .next-up { text-align:center; margin-top:18px; font-size:13px; color:#94a3b8; font-weight:500; display:none; }
    .next-up.show { display:block; }
    #cdtimer { font-weight:800; color:var(--accent); font-size:16px; }

    /* ── Streak dots ── */
    .streak-wrap { display:flex; justify-content:center; align-items:center; gap:7px; margin-bottom:18px; min-height:30px; }
    .streak-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:white; box-shadow:0 2px 8px rgba(0,0,0,0.15); transition:transform 0.2s; cursor:default; }
    .streak-dot:hover { transform:scale(1.18); }

    /* ── Counter ── */
    .counter { text-align:center; font-size:12px; color:#94a3b8; font-weight:700; letter-spacing:0.04em; margin-bottom:16px; }

    /* ── Dark mode ── */

    /* ── Logo hover ── */
    .logo-wrap { display:inline-flex; align-items:center; cursor:default; }
    .logo-wrap img { display:block; height:96px; width:auto; }
    .logo-slide { overflow:hidden; max-width:0; opacity:0; white-space:nowrap; display:flex; align-items:center; transition: max-width 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease; }
    .logo-wrap:hover .logo-slide { max-width:320px; opacity:1; }
    .logo-slide span { font-size:28px; font-weight:800; letter-spacing:-0.03em; color:#111827; padding-left:14px; }
    .logo-wrap-light .logo-slide span { color:rgba(255,255,255,0.92) !important; }
    @keyframes logoWelcome { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-6px) scale(1.05)} }

    /* ── Mladí Lekári × AMBOSS collab lockup ── */
    .collab { display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; }
    .collab img { display:block; width:auto; }
    .collab .collab-ml { height:30px; }
    .collab .collab-ab { height:30px; }
    .collab .collab-x { font-size:22px; font-weight:300; color:#cbd5e1; line-height:1; }
    .collab-light .collab-ml, .collab-light .collab-ab { filter:brightness(0) invert(1); }
    .collab-light .collab-x { color:rgba(255,255,255,0.65); }

    /* ── Mascot ── */

    /* ── ECG marquee ── */
    @keyframes ecgScroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }
    .ecg-track { display:flex; width:200%; animation:ecgScroll 3.5s linear infinite; will-change:transform; }
    .ecg-tile  { flex:0 0 50%; height:40px; display:block; overflow:visible; }

    .day-label { font-size:12.5px; font-weight:700; color:var(--theme-color); background:var(--theme-soft); padding:6px 14px; border-radius:999px; }

    /* ── Attempt pips (replaces plain counter) ── */
    .pips { display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:9px; }
    .pip {
      width:34px; height:7px; border-radius:999px; background:rgba(148,163,184,0.25);
      position:relative; overflow:hidden;
    }
    .pip.spent { background:linear-gradient(90deg,#fb7185,#e11d48); box-shadow:0 1px 6px rgba(225,29,72,0.35); }
    .pip.current { background:var(--accent-soft); }
    .pip.current::after { content:''; position:absolute; inset:0; border-radius:999px; border:2px solid var(--accent); animation:pipPulse 1.3s ease-in-out infinite; }
    .pip.win { background:linear-gradient(90deg,var(--mint),var(--mint2)); box-shadow:0 1px 6px rgba(62,207,178,0.4); }
    @keyframes pipPulse { 0%,100%{opacity:0.55;} 50%{opacity:1;} }

    /* ── XP / level chip (header) ── */
    /* ── Daily-reminder sign-up ── */
    .sub-card {
      margin-top:18px; padding:20px 22px; border-radius:18px; text-align:left;
      background:#fff; border:1.5px solid rgba(226,232,240,0.9);
      box-shadow:0 6px 22px rgba(15,23,42,0.06);
    }
    .sub-title { font-size:15.5px; font-weight:800; color:#0f172a; margin-bottom:4px; letter-spacing:-0.01em; }
    .sub-sub { font-size:13px; color:#64748b; line-height:1.55; margin-bottom:14px; }
    .sub-row { display:flex; gap:9px; align-items:stretch; flex-wrap:wrap; }
    .sub-row input[type=email] {
      flex:1; min-width:190px; padding:11px 14px; border-radius:11px;
      border:1.5px solid #e2e8f0; background:#f8fafc; font-family:inherit; font-size:14px; color:#0f172a;
      transition:border-color 0.18s ease, background 0.18s ease;
    }
    .sub-row input[type=email]:focus { outline:none; border-color:var(--accent); background:#fff; }
    .sub-btn {
      border:none; border-radius:11px; padding:11px 22px; cursor:pointer; font-family:inherit;
      font-size:14px; font-weight:800; color:#fff; white-space:nowrap;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 4px 14px rgba(233,22,128,0.28);
      transition:transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }
    .sub-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 18px rgba(233,22,128,0.34); }
    .sub-btn:disabled { opacity:0.55; cursor:not-allowed; }
    .sub-consent { display:flex; gap:8px; align-items:flex-start; margin-top:12px; font-size:11.5px; color:#94a3b8; line-height:1.5; }
    .sub-consent input { margin-top:2px; accent-color:var(--accent); flex-shrink:0; cursor:pointer; }
    .sub-consent label { cursor:pointer; }
    .sub-msg { margin-top:10px; font-size:12.5px; font-weight:700; line-height:1.5; color:#64748b; }
    .sub-msg.err { color:#e11d48; }
    .sub-done { display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:700; color:#0f766e; line-height:1.5; }
    .sub-done svg { width:17px; height:17px; stroke:#0f766e; flex-shrink:0; }

    /* ── Language switcher ── */
    .lang-switch {
      position:fixed; top:16px; right:16px; z-index:520;
      display:inline-flex; align-items:center; gap:2px; padding:3px;
      background:rgba(255,255,255,0.62); border:1.5px solid rgba(255,255,255,0.55); border-radius:999px;
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 4px 16px rgba(15,23,42,0.10);
      font-family:inherit; user-select:none;
    }
    .lang-switch button {
      border:none; background:transparent; font-family:inherit; cursor:pointer;
      font-size:11.5px; font-weight:800; letter-spacing:0.05em; color:#8a94a6;
      padding:5px 12px; border-radius:999px; transition:background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }
    .lang-switch button:hover { color:#475569; }
    .lang-switch button[aria-pressed="true"] {
      background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
      box-shadow:0 2px 8px rgba(233,22,128,0.30);
    }
    @media (max-width:480px){ .lang-switch { top:12px; right:12px; } }

    .xp-chip {
      position:fixed; top:16px; left:16px; z-index:200;
      display:flex; align-items:center; gap:9px; padding:6px 12px 6px 8px;
      background:rgba(255,255,255,0.6); border:1.5px solid rgba(255,255,255,0.5); border-radius:999px;
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 4px 16px rgba(15,23,42,0.08);
      font-family:inherit; cursor:default; user-select:none;
    }
    .xp-lvl { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-strong)); box-shadow:0 2px 8px var(--accent-glow); }
    .xp-meta { display:flex; flex-direction:column; gap:3px; }
    .xp-label { font-size:9.5px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:#94a3b8; line-height:1; }
    .xp-bar { width:74px; height:5px; border-radius:999px; background:rgba(148,163,184,0.28); overflow:hidden; }
    .xp-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width 0.9s cubic-bezier(0.22,1,0.36,1); }

    /* ── Score ring on result card ── */
    .score-wrap { display:flex; align-items:center; justify-content:center; gap:20px; margin-top:14px; }
    .score-ring { position:relative; width:96px; height:96px; flex-shrink:0; }
    .score-ring svg { transform:rotate(-90deg); }
    .score-ring-bg { stroke:rgba(255,255,255,0.25); }
    .score-ring-fill { stroke:#fff; stroke-linecap:round; transition:stroke-dashoffset 1.1s cubic-bezier(0.22,1,0.36,1); }
    .score-ring-num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
    .score-ring-num b { font-size:30px; font-weight:800; line-height:1; }
    .score-ring-num small { font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; opacity:0.8; margin-top:3px; }
    .score-side { text-align:left; color:#fff; }
    .score-xp { font-size:26px; font-weight:800; letter-spacing:-0.01em; }
    .score-xp small { font-size:14px; opacity:0.85; font-weight:700; }
    .score-cap { font-size:12.5px; opacity:0.82; margin-top:2px; font-weight:600; }
    .score-streak { margin-top:8px; font-size:12px; font-weight:700; opacity:0.9; display:inline-flex; align-items:center; gap:6px; }
  </style>
</head>

      onmouseover="this.style.background='rgba(255,255,255,0.27)';this.style.borderColor='rgba(255,255,255,0.65)'"

function catLabel(key){
  const m=CATEGORY_META[key]; if(!m) return key;
  return (LANG==='en' && m.labelEn) ? m.labelEn : m.label;
}
function categoryMatches(q){
  const n=norm(q); if(n.length<3) return [];
  const hits=[];
  for(const [key,meta] of Object.entries(CATEGORY_META)){
    if(meta.keywords.some(k=>{ const nk=norm(k); return nk.startsWith(n)||n.startsWith(nk); })) hits.push(key);
  }
  return hits;
}

/* ══════════ STATE ══════════ */
let puzzle, answer, wrongCount = 0, gameEnded = false, selectedDx = null, ddIndex = -1, pastGuesses = [], guessKinds = [];
const MAX = 6;

const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();

/* ── tolerantné vyhodnotenie odpovede: akceptuje synonymá, skratky, preklepy a vynechané prívlastky ── */
const QUALIFIERS = new Set(['akutna','akutny','akutne','chronicka','chronicky','chronicke','primarna','primarny','primarne',
  'sekundarna','sekundarny','sekundarne','komunitna','komunitny','nozokomialna','spontanna','spontanny','kalkulozna',
  'kalkulozny','systemova','systemovy','generalizovana','generalizovany','ischemicka','ischemicky','hemoragicka','hemoragicky']);
function stripQualifiers(n){ return n.split(' ').filter(w=>!QUALIFIERS.has(w)).join(' ').trim(); }
function levenshtein(a,b){
  if(a===b) return 0;
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){
      cur[j]=a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]); }
    prev=cur; }
  return prev[n];
}
function closeEnough(a,b){
  if(!a||!b) return false;
  if(a===b) return true;
  if(a.length>=4 && b.length>=4 && (a.includes(b)||b.includes(a))) return true;
  const maxDist = b.length<=6?1:(b.length<=12?2:3);
  return levenshtein(a,b)<=maxDist;
}
function matchesAnswer(raw, correctAnswer){
  const rawN=norm(raw);
  if(!rawN) return false;
  const d=DX_BY_NAME.get(correctAnswer);
  /* both languages always count as correct, whichever one the UI is in */
  const variants=[correctAnswer, d?.nameEn, ...(d?.aliases||[])].filter(Boolean).map(norm);
  if(variants.some(v=>v===rawN)) return true;
  const rawCore=stripQualifiers(rawN);
  for(const v of variants){
    const vCore=stripQualifiers(v);
    if(closeEnough(rawCore,vCore)) return true;
  }
  return false;
}
/* resolve a free-text guess to a known diagnosis object (exact → alias → fuzzy) */
function resolveGuess(raw){
  const rn=norm(raw); if(!rn) return null;
  for(const d of DIAGNOSES){ if(norm(d.name)===rn) return d; }
  for(const d of DIAGNOSES){ if(d.nameEn && norm(d.nameEn)===rn) return d; }
  for(const d of DIAGNOSES){ if((d.aliases||[]).some(a=>norm(a)===rn)) return d; }
  for(const d of DIAGNOSES){ if(matchesAnswer(raw, d.name)) return d; }
  return null;
}
/* clinically „close": a real diagnosis z rovnakej špecializácie (alebo obe nádory), ale nie tá správna */
function isCloseGuess(raw){
  const g=resolveGuess(raw); if(!g) return false;
  if(norm(g.name)===norm(answer)) return false;
  const a=DX_BY_NAME.get(answer); if(!a) return false;
  if(g.categories.includes('nador') && a.categories.includes('nador')) return true;
  return g.categories[0]===a.categories[0];
}
const EPOCH = new Date(2026,6,1);                         // 1. júl 2026 — štart KazuistiCard (náročná sada, 31 prípadov)

const MONTHS_SK = ['január','február','marec','apríl','máj','jún','júl','august','september','október','november','december'];
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dateKey(d){ return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function dateToIdx(d){ return Math.round((startOfDay(d)-EPOCH)/DAY_MS); }
function idxToDate(i){ return new Date(EPOCH.getTime()+i*DAY_MS); }
function puzzleForIdx(i){ const n=PUZZLES.length; return PUZZLES[((i%n)+n)%n]; }
function fmtDate(d){ return LANG==='en' ? `${MONTHS_EN[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : `${d.getDate()}. ${MONTHS_SK[d.getMonth()]} ${d.getFullYear()}`; }
function fmtShort(d){ return LANG==='en' ? `${d.getMonth()+1}/${d.getDate()}` : `${d.getDate()}.${d.getMonth()+1}.`; }
function isToday(d){ return dateKey(d)===dateKey(new Date()); }

/* poradie odhalenia indícií je dané polom specificity (1=najmenej špecifické), nie poradím v poli */

function escAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* render an optional image attached to a clue (radiology/ECG/derm) with attribution; hides itself if it fails to load */
function clueImageHTML(im){
  const cap = im.alt ? `<span class="ci-cap">${im.alt}</span>` : '';
  const lic = im.license ? ` · <a href="${escAttr(im.licenseUrl||'#')}" target="_blank" rel="noopener noreferrer">${im.license}</a>` : '';
  const credit = (im.credit||im.license) ? `<span class="ci-credit">${im.credit?`${t('source')}: <a href="${escAttr(im.source||'#')}" target="_blank" rel="noopener noreferrer">${im.credit}</a>`:''}${lic}</span>` : '';

      onerror="this.closest('.clue-img').classList.add('failed')">

}
/* render an optional video attached to a clue (e.g. clinical sign). Shows a neutral click-to-play
   facade first — the platform's own thumbnail/title (which can spoil the diagnosis) never appears;
   the real iframe (autoplaying) is only injected after the user explicitly clicks play. */
function clueVideoHTML(vid){

  return `<figure class="clue-video">

      <div class="cv-facade" role="button" aria-label="${t('playVideo')}">
        <div class="cv-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <span>${t('playVideo')}</span>
      </div>
    </div>
    ${credit}
  </figure>`;
}
document.getElementById('clues').addEventListener('click', e=>{

     which shows the video title/channel/suggestions and would spoil the answer */

});

    if(i<n){ d.className='clue'; d.style.animationDelay='0s'; d.innerHTML=`<div class="clue-num">${i+1}</div><div class="clue-text">${clue.video?clueVideoHTML(clue.video):clue.image?clueImageHTML(clue.image):clueText(clue)}</div>`; }
    else   { d.className='clue locked'; d.innerHTML=`<div class="clue-num">${i+1}</div><div>${t('lockedClue')}</div>`; }
    c.appendChild(d);
  });
}

/* ── history ── */
function renderHistory(){
  const e=document.getElementById('ghist');
  e.innerHTML=pastGuesses.map((g,i)=>{
    const close=guessKinds[i]==='close';
    /* show the guess in the current language when it maps to a known diagnosis */
    const d=resolveGuess(g); const label=d?dxLabel(d):g;
    return `<div class="gchip${close?' close':''}"><span class="x">${close?'≈':'✕'}</span>${label}</div>`;
  }).join('');
}

/* ── autocomplete ── */
function filterDx(q){
  const n=norm(q); if(n.length<2) return { direct:[], groups:[] };

  const direct=[];
  for(const dx of DIAGNOSES){
    /* search the displayed name first, then the other language, then aliases */
    if(norm(dxLabel(dx)).includes(n)){ direct.push({dx, viaAlias:null}); continue; }
    const other = LANG==='en' ? dx.name : (dx.nameEn||'');
    if(other && norm(other).includes(n)){ direct.push({dx, viaAlias:other}); continue; }
    const hitAlias=(dx.aliases||[]).find(a=>norm(a).includes(n));
    if(hitAlias) direct.push({dx, viaAlias:hitAlias});
  }
  direct.sort((a,b)=>{
    const na=norm(dxLabel(a.dx)), nb=norm(dxLabel(b.dx));
    const aRank = a.viaAlias ? (norm(a.viaAlias).startsWith(n)?1:2) : (na.startsWith(n)?0:2);
    const bRank = b.viaAlias ? (norm(b.viaAlias).startsWith(n)?1:2) : (nb.startsWith(n)?0:2);
    if(aRank!==bRank) return aRank-bRank;
    if(na.length!==nb.length) return na.length-nb.length;
    return na.localeCompare(nb);
  });

  const hitKeys=categoryMatches(q);
  const groups=[];
  const infekKeys=hitKeys.filter(k=>k.startsWith('infekcia:'));
  const otherKeys=hitKeys.filter(k=>!k.startsWith('infekcia:'));
  if(infekKeys.length){
    const subs=infekKeys.map(k=>({ label:catLabel(k), items:DIAGNOSES.filter(d=>d.categories.includes(k)).sort((a,b)=>dxLabel(a).localeCompare(dxLabel(b))) }))
      .filter(s=>s.items.length);
    if(subs.length) groups.push({ type:'nested', label:t('infections'), subs, count:subs.reduce((n,s)=>n+s.items.length,0) });
  }
  otherKeys.forEach(k=>{
    const items=DIAGNOSES.filter(d=>d.categories.includes(k)).sort((a,b)=>dxLabel(a).localeCompare(dxLabel(b)));
    if(items.length) groups.push({ type:'flat', key:k, label:catLabel(k), items, count:items.length });
  });

  return { direct: direct.slice(0,12), groups };
}
function hl(text,q){ const n=norm(q); const t=norm(text); const i=t.indexOf(n); if(i<0) return text; return text.slice(0,i)+'<span class="match">'+text.slice(i,i+q.trim().length)+'</span>'+text.slice(i+q.trim().length); }

function makeDxRow(dx, q, viaAlias){
  const d=document.createElement('div'); d.className='dd-item'; d.dataset.name=dx.name;
  d.innerHTML = hl(dxLabel(dx),q) + (viaAlias ? `<span class="dd-alias-tag">${t('matchVia')}: ${viaAlias}</span>` : '');
  d.addEventListener('mousedown',e=>{ e.preventDefault(); pick(dx.name); });
  return d;
}
function makeGroupHeader(label,count){
  const h=document.createElement('div'); h.className='dd-group-header';
  h.innerHTML = `<span>${label} (${count})</span><span class="chev">▸</span>`;
  return h;
}
function openDropdown(result,q){
  dropdown.innerHTML='';
  const {direct,groups}=result;
  if(!direct.length && !groups.length){ dropdown.innerHTML=`<div class="dd-empty">${t('noMatch')}</div>`; dropdown.classList.add('open'); return; }

  direct.forEach(({dx,viaAlias})=>dropdown.appendChild(makeDxRow(dx,q,viaAlias)));

  groups.forEach(g=>{
    const header=makeGroupHeader(g.label,g.count);
    const body=document.createElement('div'); body.className='dd-group-body'; body.style.display='none';
    header.addEventListener('mousedown',e=>e.preventDefault());
    header.addEventListener('click',()=>{
      const open=header.classList.toggle('expanded');
      body.style.display = open?'block':'none';
      body.classList.toggle('shown',open);
      if(open && !body.dataset.built){
        body.dataset.built='1';
        if(g.type==='nested'){
          g.subs.forEach(sub=>{
            const subHead=document.createElement('div'); subHead.className='dd-group-sub'; subHead.textContent=sub.label;
            body.appendChild(subHead);
            sub.items.forEach(dx=>body.appendChild(makeDxRow(dx,q,null)));
          });
        } else {
          g.items.forEach(dx=>body.appendChild(makeDxRow(dx,q,null)));
        }
      }
    });
    dropdown.appendChild(header);
    dropdown.appendChild(body);
  });

  dropdown.classList.add('open'); ddIndex=-1;
}
function closeDropdown(){ dropdown.classList.remove('open'); ddIndex=-1; }
function pick(name){ selectedDx=name; input.value=name; closeDropdown(); }

input.addEventListener('input', ()=>{ selectedDx=null; const q=input.value.trim(); if(q.length<2){ closeDropdown(); return; } openDropdown(filterDx(q),q); });
input.addEventListener('keydown', e=>{
  const items=Array.from(dropdown.querySelectorAll('.dd-item')).filter(it=>{
    const wrap=it.closest('.dd-group-body'); return !wrap || wrap.classList.contains('shown');
  });
  if(!dropdown.classList.contains('open')){ if(e.key==='Enter'){ e.preventDefault(); submit(); } return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); ddIndex=Math.min(ddIndex+1,items.length-1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); ddIndex=Math.max(ddIndex-1,-1); }
  else if(e.key==='Enter'){ e.preventDefault(); if(ddIndex>=0&&items[ddIndex]) pick(items[ddIndex].dataset.name); else submit(); return; }
  else if(e.key==='Escape'){ closeDropdown(); return; }
  items.forEach((it,i)=>it.classList.toggle('active',i===ddIndex));
  if(ddIndex>=0&&items[ddIndex]){ selectedDx=items[ddIndex].dataset.name; input.value=items[ddIndex].dataset.name; }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.ac-wrap')) closeDropdown(); });

/* ── submit ── */
document.getElementById('submit-btn').addEventListener('click', submit);
function submit(){
  if(gameEnded) return;
  const raw=(selectedDx||input.value).trim();
  if(!raw){ const w=document.getElementById('input-row'); w.style.animation='shake .4s'; setTimeout(()=>w.style.animation='',420); return; }

  if(matchesAnswer(raw, answer)){
    gameEnded=true; renderClues(puzzle.clues.length);
    showBanner('correct','correct', wrongCount+1);
    endGame(true);
  } else {
    const close=isCloseGuess(raw);
    pastGuesses.push(raw); guessKinds.push(close?'close':'wrong'); wrongCount++; renderHistory();
    if(wrongCount>=MAX){ gameEnded=true; renderClues(puzzle.clues.length); showBanner('failed','failed'); endGame(false); }
    else if(close){ showBanner('close','close'); renderClues(wrongCount+1); updateCounter(); setMascot('think'); }
    else { showBanner('incorrect','incorrect'); renderClues(wrongCount+1); updateCounter(); setMascot('think'); }
  }
  input.value=''; selectedDx=null; closeDropdown();
}

/* ── end game ── */
const RESULTS = {
  win:  { emoji:'', labelKey:'winLabel', subKey:'winSub',     bg:'linear-gradient(135deg,#3ecfb2,#27b99d)', cls:'bg-good' },
  lose: { emoji:'', labelKey:'loseLabel', subKey:'loseSub',           bg:'linear-gradient(135deg,#f472b6,#e91680)', cls:'bg-bad' },
};
function endGame(won){
  input.disabled=true; document.getElementById('submit-btn').disabled=true;
  gameWon=won; updateCounter(); saveDay(won);
  const points=won?(MAX-wrongCount):0;
  const awardedXp=won?awardXP(points):0;
  renderStreak();
  const cfg = won?RESULTS.win:RESULTS.lose;
  document.body.className=cfg.cls;
  setMascot(won?'win':'lose');

  document.getElementById('results').innerHTML = buildResultCard(won, points, awardedXp, computeStreak(), false);
  document.getElementById('results').style.display='block';
  animateResult(awardedXp);
  if(isToday(viewDate)){ document.getElementById('next-up').classList.add('show'); startCountdown(); }
  document.getElementById('share-btn').addEventListener('click', share);
  setTimeout(()=>{ playEnd(won); if(won) confetti(); }, 380);
  setTimeout(()=>document.getElementById('results').scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}

/* ── persistence: per-date results map + 7-day streak ── */
function loadResults(){ try{ return JSON.parse(localStorage.getItem('dd_results')||'{}'); }catch{ return {}; } }
function saveResults(o){ localStorage.setItem('dd_results',JSON.stringify(o)); }
function getResult(d){ return loadResults()[dateKey(d)]||null; }
function saveDay(won){
  const o=loadResults();
  o[dateKey(viewDate)]={ won, tries:wrongCount+(won?1:0), guesses:pastGuesses };
  saveResults(o);
}
function renderStreak(){
  const wrap=document.getElementById('streak-wrap');
  const res=loadResults();
  const today=startOfDay(new Date());
  if(!Object.keys(res).length){ wrap.innerHTML=`<span style="font-size:12px;color:#94a3b8;font-weight:600;">${t('noCasesYet')}</span>`; return; }
  let html='';
  for(let k=6;k>=0;k--){
    const d=new Date(today.getTime()-k*DAY_MS);
    if(dateToIdx(d)<0){ html+='<div class="streak-dot" style="background:rgba(148,163,184,0.13);box-shadow:none;"></div>'; continue; }
    const r=res[dateKey(d)];
    if(!r){ html+=`<div class="streak-dot" style="background:rgba(148,163,184,0.13);box-shadow:none;" title="${fmtShort(d)} — ${t('notPlayed')}"></div>`; continue; }
    html+=`<div class="streak-dot" style="background:${r.won?'linear-gradient(135deg,#3ecfb2,#27b99d)':'linear-gradient(135deg,#f472b6,#e91680)'};" title="${fmtShort(d)} — ${r.won?'Správne':'Nesprávne'}">${r.won?'✓':'✕'}</div>`;
  }
  wrap.innerHTML=html;
}

function share(){
  const won=gameWon;
  const tries=won?wrongCount+1:wrongCount;
  const scoreStr=won?`${tries}/${MAX}`:`X/${MAX}`;
  const points=won?(MAX-wrongCount):0;
  const dx=answer||'';
  const xp=loadXP(), lvl=levelFromXp(xp);
  const dateStr=fmtDate(viewDate);

  const W=1080, H=1920;
  const canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');

  /* no crossOrigin here — these are local same-folder assets, and setting crossOrigin='anonymous'
     on a file:// page makes Chrome silently fail to load them (onerror fires), which is why the
     logos were vanishing when the file was opened by double-click instead of via a server */
  const loadImg=src=>new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  /* recolour a transparent logo to a solid white silhouette (canvas can't apply CSS filters) */
  function whiteSil(img,h){ if(!img) return null; const w=h*(img.naturalWidth/img.naturalHeight); const off=document.createElement('canvas'); off.width=Math.ceil(w); off.height=Math.ceil(h); const o=off.getContext('2d'); o.drawImage(img,0,0,w,h); o.globalCompositeOperation='source-in'; o.fillStyle='#fff'; o.fillRect(0,0,off.width,off.height); return {canvas:off,w,h}; }

  Promise.all([loadImg(LOGO_ML_B64), loadImg(LOGO_AB_B64), loadImg(LOGO_ABMARK_B64), (document.fonts&&document.fonts.ready)||Promise.resolve()]).then(([mlImg,abImg,abMarkImg])=>{
    draw(mlImg,abImg,abMarkImg); exportCanvas();
  });

  function draw(mlImg,abImg,abMarkImg){
    // background gradient (pink → AMBOSS teal) + soft glows
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#e91680'); bg.addColorStop(0.45,'#a51f6f'); bg.addColorStop(1,'#0a6e71');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const glow=(x,y,r,c)=>{ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,c); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); };
    glow(W-30,110,540,'rgba(62,207,178,0.34)');
    glow(70,H-120,520,'rgba(233,22,128,0.30)');
    glow(W/2,H/2,760,'rgba(255,255,255,0.05)');

    ctx.textAlign='center';

    // ── collab badge (top): a real branded card, not two faint logos floating in space.
    // ml (mladí lekári) is a wide 6:1 wordmark; ab (AMBOSS) is a compact 1.79:1 mark — stacked
    // inside one framed card so each is independently centred (guaranteed non-lopsided) while
    // the card itself gives the lockup the presence/"this is from someone" weight it needs.
    const mlH=54, abH=70, rowGap=22, padX=64, padY=34;
    const ml=whiteSil(mlImg,mlH), ab=whiteSil(abImg,abH);
    const dividerW=84;
    const badgeContentW=Math.max(ml?ml.w:0, ab?ab.w:0, dividerW);
    const badgeW=badgeContentW+padX*2;
    const badgeContentH=mlH+rowGap+2+rowGap+abH;
    const badgeH=badgeContentH+padY*2;
    const badgeX=(W-badgeW)/2, badgeY=64;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.28)'; ctx.shadowBlur=36; ctx.shadowOffsetY=14;
    roundRect(badgeX,badgeY,badgeW,badgeH,32);
    ctx.fillStyle='rgba(255,255,255,0.13)'; ctx.fill();
    ctx.restore();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,0.3)';
    roundRect(badgeX,badgeY,badgeW,badgeH,32); ctx.stroke();

    let rowY=badgeY+padY;
    if(ml){ ctx.drawImage(ml.canvas, W/2-ml.w/2, rowY); }
    rowY+=mlH+rowGap;
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(W/2-dividerW/2,rowY+1); ctx.lineTo(W/2+dividerW/2,rowY+1); ctx.stroke();
    rowY+=2+rowGap;
    if(ab){ ctx.drawImage(ab.canvas, W/2-ab.w/2, rowY); }

    // ── label + date ──
    const labelY=badgeY+badgeH+64;
    ctx.fillStyle='rgba(255,255,255,0.62)'; ctx.font='800 27px "Plus Jakarta Sans",system-ui,sans-serif';
    ctx.fillText('KazuistiCard', W/2, labelY);
    ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font='500 27px "Plus Jakarta Sans",system-ui,sans-serif';
    ctx.fillText(dateStr, W/2, labelY+42);

    // ── score ring ──
    const cx=W/2, cy=630, R=180;
    ctx.lineWidth=26; ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    const pct=won?points/MAX:0;
    if(pct>0){ ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+pct*Math.PI*2); ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.font='800 118px "Plus Jakarta Sans",system-ui,sans-serif';
    ctx.fillText(scoreStr, cx, cy+42);

    // ── subtitle ──
    ctx.fillStyle='#fff'; ctx.font='700 36px "Plus Jakarta Sans",system-ui,sans-serif';
    ctx.fillText(won? t('shareDx', tries) : t('shareFail'), W/2, 908);

    // ── attempt squares ──
    const SQ=74, GAP=16, gw=MAX*(SQ+GAP)-GAP, sx=(W-gw)/2, sy=956;
    for(let i=0;i<MAX;i++){
      const x=sx+i*(SQ+GAP);
      let fill;
      if(i<wrongCount) fill='rgba(0,0,0,0.22)';
      else if(i===wrongCount&&won) fill='#ffffff';
      else fill='rgba(255,255,255,0.14)';
      roundRect(x,sy,SQ,SQ,18); ctx.fillStyle=fill; ctx.fill();
      if(i<wrongCount){ ctx.fillStyle='rgba(255,255,255,0.72)'; ctx.font='800 30px "Plus Jakarta Sans",system-ui,sans-serif'; ctx.fillText(String(i+1),x+SQ/2,sy+SQ/2+11); }
      else if(i===wrongCount&&won){ ctx.fillStyle='#0a6e71'; ctx.font='800 30px "Plus Jakarta Sans",system-ui,sans-serif'; ctx.fillText(String(i+1),x+SQ/2,sy+SQ/2+11); }
    }

    // ── diagnosis pill ──
    ctx.font='800 40px "Plus Jakarta Sans",system-ui,sans-serif';
    const pw=Math.min(W-120, ctx.measureText(dx).width+90), ph=90, px=(W-pw)/2, py=1086;
    roundRect(px,py,pw,ph,ph/2); ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.34)'; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.fillText(dx, W/2, py+ph/2+14);

    // ── level badge ──
    ctx.font='800 30px "Plus Jakarta Sans",system-ui,sans-serif';
    const lvlText=`LEVEL ${lvl} · ${xp} XP`;
    const lw=ctx.measureText(lvlText).width+64, lh=64, lx=(W-lw)/2, ly=1216;
    roundRect(lx,ly,lw,lh,lh/2); ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.fill();
    ctx.fillStyle='#a51f6f'; ctx.fillText(lvlText, W/2, ly+lh/2+11);

    // ── AMBOSS perk strip: box is sized to its own content (icon+text+padding), not a fixed
    // oversized width — that fixed-900px box was the actual cause of the "empty space" complaint,
    // since a centred small group inside a much wider box still reads as mostly-empty. Icon is
    // also much bigger now so the AMBOSS mark reads clearly, not as an afterthought.
    const stL1=t('shareL1');
    const stL2=t('shareL2');
    const stL3=t('shareL3');
    const stL4=t('shareL4');
    ctx.textAlign='left';
    ctx.font='800 33px "Plus Jakarta Sans",system-ui,sans-serif'; const w1=ctx.measureText(stL1).width;
    ctx.font='500 25px "Plus Jakarta Sans",system-ui,sans-serif';
    const maxTextW=Math.max(w1, ctx.measureText(stL2).width, ctx.measureText(stL3).width, ctx.measureText(stL4).width);

    const iconH=112, groupGap=38, boxPadX=54, boxPadY=46;
    const abs=whiteSil(abMarkImg,iconH);
    const iconW=abs?abs.w:0;
    const groupW=iconW+(iconW?groupGap:0)+maxTextW;
    const stW=groupW+boxPadX*2, stX=(W-stW)/2;

    const b1off=30, lg1=46, lg2=40;                      // baseline offsets from box top, even 40px rhythm below headline
    const textBlockH=b1off+lg1+lg2+lg2+10;                // headline ascent .. last line descent, roughly
    const stH=Math.max(textBlockH, iconH)+boxPadY*2;
    const stY=1336;                                       // after the level badge (bottom ≈1280) with a 56px gap

    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.22)'; ctx.shadowBlur=30; ctx.shadowOffsetY=12;
    roundRect(stX,stY,stW,stH,32);
    const stBg=ctx.createLinearGradient(stX,stY,stX+stW,stY+stH);
    stBg.addColorStop(0,'#0a6e71'); stBg.addColorStop(1,'#009ba4');
    ctx.fillStyle=stBg; ctx.fill();
    ctx.restore();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,0.24)';
    roundRect(stX,stY,stW,stH,32); ctx.stroke();

    const groupX=stX+boxPadX, iconY=stY+(stH-iconH)/2;

function playEnd(won){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const notes = won?[523,659,784,1047,1319]:[440,415,392,349];
  const t0 = won?[0,.13,.26,.39,.52]:[0,.38,.76,1.14];
  notes.forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
    o.type=won?'sine':'sine'; o.frequency.value=f; const t=ctx.currentTime+t0[i];
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(won?(i===4?.3:.22):.15,t+.05);
    g.gain.exponentialRampToValueAtTime(.001,t+(won?(i===4?1.1:.3):.55)); o.start(t); o.stop(t+1.3); }); }catch(e){} }

/* ── confetti ── */
function confetti(){ const c=document.createElement('canvas'); c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;'; document.body.appendChild(c);
  const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const COLORS=['#e91680','#c91270','#f472b6','#f9a8d4','#3ecfb2','#27b99d','#7ff5e2','#ffffff'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.5,w:6+Math.random()*9,h:3+Math.random()*5,color:COLORS[Math.floor(Math.random()*COLORS.length)],rot:Math.random()*6.28,rs:(Math.random()-.5)*.18,vx:(Math.random()-.5)*2.5,vy:2.5+Math.random()*3,o:1,shape:Math.random()>.5?'r':'c'}));
  let f=0; (function d(){ x.clearRect(0,0,c.width,c.height); let alive=false;
    P.forEach(p=>{ p.x+=p.vx+Math.sin(f*.04+p.y*.02)*.6; p.y+=p.vy; p.rot+=p.rs; if(p.y>c.height*.75)p.o-=.025; if(p.o>0)alive=true;
      x.save(); x.globalAlpha=Math.max(0,p.o); x.translate(p.x,p.y); x.rotate(p.rot); x.fillStyle=p.color;
      if(p.shape==='c'){ x.beginPath(); x.arc(0,0,p.w/2,0,6.28); x.fill(); } else x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    f++; if(alive&&f<350) requestAnimationFrame(d); else c.remove(); })(); }

/* Paste the endpoint that collects the addresses (Formspree, Mailchimp, a Google
   Apps Script, your own API…). It receives a POST with JSON:
       { email, lang, day }
   IMPORTANT: while this is empty nothing leaves the visitor's device — the address
   is only remembered in their own localStorage and is NOT collected anywhere.
   Set it before you rely on sign-ups. */
const SUBSCRIBE_ENDPOINT = '';

function getSub(){ try{ return localStorage.getItem('dd_sub')||''; }catch{ return ''; } }
function setSub(v){ try{ localStorage.setItem('dd_sub',v); }catch{} }
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v.trim()); }
const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  const saved=getSub();

  if(saved) return `<div class="sub-card"><div class="sub-done">${checkSvg}<span>${SUBSCRIBE_ENDPOINT ? t('subDone', escAttr(saved)) : t('subSoon', escAttr(saved))}</span></div></div>`;
  return `

      <div class="sub-title">${t('subTitle')}</div>

        <button type="button" class="sub-btn" id="sub-btn">${t('subBtn')}</button>
      </div>
      <div class="sub-consent">
        <input type="checkbox" id="sub-consent">
        <label for="sub-consent">${t('subConsent')}</label>
      </div>
      <div class="sub-msg" id="sub-msg"></div>
    </div>`;
}

async function submitSub(){
  const inp=document.getElementById('sub-email');
  const chk=document.getElementById('sub-consent');
  const msg=document.getElementById('sub-msg');
  const btn=document.getElementById('sub-btn');
  const card=document.getElementById('sub-card');
  if(!inp||!msg||!card) return;
  const email=inp.value.trim();
  if(!validEmail(email)){ msg.className='sub-msg err'; msg.textContent=t('subBadEmail'); inp.focus(); return; }
  if(chk && !chk.checked){ msg.className='sub-msg err'; msg.textContent=t('subNeedConsent'); return; }
  if(btn) btn.disabled=true;
  msg.className='sub-msg'; msg.textContent=t('subSending');
  try{
    if(SUBSCRIBE_ENDPOINT){
      const r=await fetch(SUBSCRIBE_ENDPOINT,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ email, lang:LANG, day:dateKey(viewDate) })
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
      setSub(email);
      card.innerHTML=`<div class="sub-done">${checkSvg}<span>${t('subDone', escAttr(email))}</span></div>`;
    } else {
      console.warn('[KazuistiCard] SUBSCRIBE_ENDPOINT is empty — "'+email+'" was stored only in this browser and was NOT sent anywhere. Set SUBSCRIBE_ENDPOINT to start collecting addresses.');
      setSub(email);
      card.innerHTML=`<div class="sub-done">${checkSvg}<span>${t('subSoon', escAttr(email))}</span></div>`;
    }
  }catch(err){
    if(btn) btn.disabled=false;
    msg.className='sub-msg err'; msg.textContent=t('subError');
  }
}

        <div class="amboss-mark"><img src="amboss-mark.png" alt="AMBOSS"></div>
        <div class="amboss-headline">${t('ambossHeadline', dx)}</div>
        <div class="amboss-quote">${t('ambossQuote')}</div>
        <a class="amboss-cta" id="amboss-cta" href="${ambossUrl(dx)}" target="_blank" rel="noopener noreferrer">
          <span>${t('ambossCta')}</span>
          <svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </a>
        <div class="amboss-mac-wrap">
          <div class="amboss-mac" id="amboss-mac">
            <div class="amboss-mac-lid" id="amboss-mac-lid">
              <div class="amboss-mac-cam"></div>
              <div class="amboss-screen">
                <div class="amboss-screen-head">
                  <img src="amboss-mark.png" alt="AMBOSS">
                  <div class="amboss-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <span>${t('ambossSearch')}</span>
                  </div>
                </div>
                <div class="amboss-screen-body">
                  <div class="amboss-row highlight-row"><div class="dot" style="background:#fff;"></div><div class="real-label">${dx}</div></div>
                  <div class="amboss-row"><div class="dot"></div><div class="lines"><div class="line"></div><div class="line short"></div></div></div>
                  <div class="amboss-row"><div class="dot"></div><div class="lines"><div class="line"></div><div class="line short"></div></div></div>
                </div>
              </div>
            </div>
            <div class="amboss-mac-base"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="amboss-stats">${statsHtml}</div>`;
}
/* scroll-triggered MacBook opening + subtle mouse-tilt + count-up on the stat numbers */
function initAmbossPromo(){
  const promo=document.getElementById('amboss-promo'); if(!promo) return;
  const mac=document.getElementById('amboss-mac');
  if(mac){
    if('IntersectionObserver' in window){
      const io=new IntersectionObserver((entries)=>{
        entries.forEach(e=>{ if(e.isIntersecting){ mac.classList.add('open'); io.disconnect(); } });
      }, { threshold:0.35 });
      io.observe(mac);
    } else mac.classList.add('open');
    promo.addEventListener('mousemove', e=>{
      const r=promo.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width-0.5;
      mac.style.transform=`rotateY(${px*10}deg)`;
    });
    promo.addEventListener('mouseleave', ()=>{ mac.style.transform=''; });
  }
  const statsWrap = promo.nextElementSibling; /* .amboss-stats renders as a sibling, not a child, of #amboss-promo */
  (statsWrap||document).querySelectorAll('.amboss-stat b[data-count-to]').forEach(b=>{
    const to=parseInt(b.dataset.countTo,10), suffix=b.dataset.suffix||'';
    countUpFormatted(b, to, 900, suffix);
  });
}
function countUpFormatted(el,to,ms,suffix){
  if(!el) return; const start=performance.now();
  const fmt=n=>Math.round(n).toLocaleString('sk-SK');
  (function tick(now){ const p=Math.min(1,(now-start)/ms); el.textContent=fmt(p*to)+suffix; if(p<1) requestAnimationFrame(tick); })(start);
  setTimeout(()=>{ el.textContent=fmt(to)+suffix; }, ms+80);
}
function animateResult(awardedXp){
  const fill=document.querySelector('.score-ring-fill');
  if(fill){ const t=fill.getAttribute('data-target'); setTimeout(()=>{ fill.style.strokeDashoffset=t; }, 60); }
  if(awardedXp!=null) countUp(document.getElementById('xp-count'), awardedXp, 900);
  initAmbossPromo();
}

/* ── init ── */
/* ── i18n: paint static strings + re-render everything that is language-dependent ── */
function applyI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('#lang-switch button').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.lang===LANG));
  });
}
/* full repaint after a language switch, preserving the exact game state */
function relocalize(){
  applyI18n();
  if(!puzzle) return;
  answer = puzzle.answer;
  updateDayLabel(); renderStreak(); renderXP();
  renderClues(gameEnded ? puzzle.clues.length : Math.min(wrongCount+1, puzzle.clues.length));
  renderHistory(); updateCounter();
  repaintBanner();
  if(gameEnded){
    const res=document.getElementById('results');
    if(res && res.style.display==='block'){
      res.innerHTML=buildResultCard(gameWon, gameWon?(MAX-wrongCount):0, null, computeStreak(), true);
    }
  }
  const am=document.getElementById('archive-modal');
  if(am && am.style.display!=='none' && am.classList.contains('open')) openArchive();
}
document.getElementById('lang-switch').addEventListener('click', e=>{
  const b=e.target.closest('button[data-lang]'); if(!b) return;
  if(b.dataset.lang===LANG) return;
  setLang(b.dataset.lang);
  relocalize();
});

function init(){
  applyI18n();
  renderXP();
  loadDay(dateToIdx(startOfDay(new Date())));
}

/* ── archive ── */
function openArchive(){
  const m=document.getElementById('archive-modal');
  const grid=document.getElementById('arch-grid');
  const res=loadResults();
  const todayIdxv=dateToIdx(startOfDay(new Date()));
  let html='';
  for(let i=todayIdxv;i>=0;i--){
    const d=idxToDate(i);
    const r=res[dateKey(d)];
    const isT=(i===todayIdxv);
    let cls='open', badge=t('play'), state=t('archiveTag');
    if(r){ cls=r.won?'won':'lost'; badge=r.won?'✓':'✕'; state=r.won?`${r.tries}/${MAX}`:t('unsolvedShort'); }
    else if(isT){ badge=t('today'); state=t('newCase'); }
    html+=`<button type="button" class="arch-day ${cls}${isT?' today':''}" data-idx="${i}">`
        + `<span class="arch-date">${fmtShort(d)}</span>`
        + `<span class="arch-badge">${badge}</span>`
        + `<span class="arch-state">${state}</span></button>`;
  }
  grid.innerHTML=html;
  grid.querySelectorAll('.arch-day').forEach(b=>b.addEventListener('click',()=>{
    closeArchive();
    loadDay(parseInt(b.dataset.idx,10));
    window.scrollTo({top:0,behavior:'smooth'});
  }));
  m.style.display='flex'; requestAnimationFrame(()=>m.classList.add('open'));
}
function closeArchive(){ const m=document.getElementById('archive-modal'); m.classList.remove('open'); setTimeout(()=>{ m.style.display='none'; },210); }
document.getElementById('archive-btn').addEventListener('click', openArchive);
document.getElementById('arch-close').addEventListener('click', closeArchive);
document.getElementById('archive-modal').addEventListener('click', e=>{ if(e.target.id==='archive-modal') closeArchive(); });
function resetGameState(){
  wrongCount=0; pastGuesses=[]; guessKinds=[]; gameEnded=false; gameWon=false; selectedDx=null;
  input.disabled=false; document.getElementById('submit-btn').disabled=false;
  input.value='';
  document.getElementById('results').style.display='none';
  document.getElementById('results').innerHTML='';
  document.getElementById('next-up').classList.remove('show');
  document.getElementById('banner').className='banner';
  document.getElementById('ghist').innerHTML='';
  document.body.className='';
}
/* loadDay(idx): load the case for a given day. Unplayed → fresh game (answer hidden until solved). Played → locked result. */
function loadDay(idx){
  dayIdx=idx; viewDate=idxToDate(idx); lastBanner=null;
  puzzle=puzzleForIdx(idx); answer=puzzle.answer;
  resetGameState();
  applyTheme(resolveThemeKey(puzzle));
  updateDayLabel();
  renderStreak(); renderXP(); setMascot('idle');
  const r=getResult(viewDate);
  if(r){
    wrongCount=r.guesses?.length||0; pastGuesses=r.guesses||[]; gameEnded=true; gameWon=r.won;
    renderClues(puzzle.clues.length); renderHistory(); renderPips();
    showBanner(r.won?'correct':'failed', r.won?'alreadySolved':'alreadyDone', r.tries);
    endGameLocked(r.won);
  } else {
    renderClues(1); updateCounter();
    input.focus();
  }
}
function updateDayLabel(){
  const el=document.getElementById('day-label'); if(!el) return;
  el.textContent = isToday(viewDate) ? `${t('todayCase')} · ${fmtDate(viewDate)}` : `${t('archiveCase')} · ${fmtDate(viewDate)}`;
}
function endGameLocked(won){
  input.disabled=true; document.getElementById('submit-btn').disabled=true;
  const cfg=won?RESULTS.win:RESULTS.lose; document.body.className=cfg.cls; setMascot(won?'win':'lose');
  const points=won?(MAX-wrongCount):0;
  document.getElementById('results').innerHTML=buildResultCard(won, points, null, computeStreak(), true);
  document.getElementById('results').style.display='block';
  animateResult(null);
  if(isToday(viewDate)){ document.getElementById('next-up').classList.add('show'); startCountdown(); }
  document.getElementById('share-btn').addEventListener('click', share);
}

/* paint the welcome screen in the saved language before anything else */
applyI18n();
</script>
